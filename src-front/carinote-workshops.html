<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ワークショップ一覧 | Carinote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--m:#8B6F5A;--a:#D98268;--bg:#FAF8F3;--t:#333;--muted:#77736D;--line:#E6E0D8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:"Noto Sans JP",sans-serif;line-height:1.8}.wrap{width:min(100% - 32px,1100px);margin:auto}header{border-bottom:1px solid var(--line);background:#fff;padding:20px 0}header a{color:var(--m);font-size:22px;font-weight:700;text-decoration:none}.hero{padding:64px 0 40px}.eyebrow{color:var(--a);font-size:13px;font-weight:700;letter-spacing:.12em}h1{font-size:38px;line-height:1.4}h2{font-size:21px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.filters input,.filters select{padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 4px 12px rgb(51 51 51 / 8%)}.image{height:180px;background:linear-gradient(135deg,#D9C7B4,#A8B8A0)}.card:nth-child(2) .image{background:linear-gradient(135deg,#C4D0C0,#E7C0AE)}.card:nth-child(3) .image{background:linear-gradient(135deg,#DFC9B0,#B9A899)}.body{padding:20px}.meta{color:var(--a);font-size:12px;font-weight:700}.body p{color:var(--muted);font-size:14px}.btn{display:inline-block;padding:10px 18px;border-radius:8px;background:var(--m);color:#fff;text-decoration:none;font-weight:700}.btn:hover{background:#705744}@media(max-width:767px){.grid{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<header>
<div class="wrap">
<a href="carinote-index.html">Carinote</a>
</div>
</header>
<main class="wrap">
<section class="hero">
<p class="eyebrow">WORKSHOPS</p>
<h1>心に残るワークショップを探す</h1>
<p>香り、素材、地域の文化。気になるテーマや開催日から、自分に合う体験を見つけられます。</p>
<div class="filters">
<input type="search" placeholder="キーワードで検索">
<select>
<option>カテゴリを選択</option>
<option>香り・植物</option>
<option>ものづくり</option>
<option>地域文化</option>
</select>
<select>
<option>開催日を選択</option>
<option>今月開催</option>
<option>来月開催</option>
</select>
</div>
</section>
<section>
<div class="grid">
<article class="card">
<div class="image">
</div>
<div class="body">
<div class="meta">香り・植物｜10月10日</div>
<h2>自分だけの香りをつくる</h2>
<p>素材の香りを楽しみながら、オリジナルの香水をつくります。</p>
<a class="btn" href="carinote-workshop-detail.html">詳細を見る</a>
</div>
</article>
<article class="card">
<div class="image">
</div>
<div class="body">
<div class="meta">ものづくり｜10月17日</div>
<h2>手のひらサイズの器づくり</h2>
<p>土に触れ、暮らしに寄り添う器をつくる時間です。</p>
<a class="btn" href="carinote-workshop-detail.html">詳細を見る</a>
</div>
</article>
<article class="card">
<div class="image">
</div>
<div class="body">
<div class="meta">地域文化｜10月24日</div>
<h2>土地の記憶を聞く、染め体験</h2>
<p>地域に伝わる素材と技法から、ものづくりを学びます。</p>
<a class="btn" href="carinote-workshop-detail.html">詳細を見る</a>
</div>
</article>
</div>
</section>
</main>
</body>
</html>
