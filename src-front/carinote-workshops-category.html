<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カテゴリ別一覧 | Carinote</title>
  <style>
    :root{--main:#8B6F5A;--accent:#D98268;--bg:#FAF8F3;--text:#333;--muted:#77736D;--line:#E6E0D8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",sans-serif;line-height:1.8}
    .wrap{width:min(100% - 32px,1100px);margin:auto}header{border-bottom:1px solid var(--line);background:#fff;padding:20px 0}header a{color:var(--main);font-size:22px;font-weight:700;text-decoration:none}.hero{padding:64px 0 36px}.eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.12em}h1{font-size:38px;line-height:1.4}.categories{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}.categories a{padding:12px 20px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--main);text-decoration:none}.categories a:hover{background:var(--main);color:#fff}.group{margin:32px 0}.group h2{padding-bottom:10px;border-bottom:2px solid var(--main)}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.item{padding:22px;border:1px solid var(--line);border-radius:12px;background:#fff}.item p{color:var(--muted);font-size:14px}.btn{display:inline-block;padding:9px 16px;border-radius:8px;background:var(--main);color:#fff;text-decoration:none;font-weight:700}@media(max-width:767px){h1{font-size:30px}.items{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="wrap"><a href="carinote-index.html">Carinote</a></div></header>
  <main class="wrap">
    <section class="hero"><p class="eyebrow">WORKSHOPS / CATEGORY</p><h1>カテゴリ別一覧</h1><p>興味のあるテーマからワークショップを探せます。</p>
      <nav class="categories" aria-label="カテゴリ"><a href="#craft">手づくり・クラフト</a><a href="#food">食・暮らし</a><a href="#local">地域文化</a></nav>
    </section>
    <section id="craft" class="group"><h2>手づくり・クラフト</h2><div class="items"><article class="item"><h3>自分だけの香りをつくる</h3><p>素材を選びながらオリジナルの香りをつくります。</p><a class="btn" href="carinote-workshop-detail.html">詳細を見る</a></article></div></section>
    <section id="food" class="group"><h2>食・暮らし</h2><div class="items"><article class="item"><h3>季節の保存食づくり</h3><p>旬の素材を使って、日々の暮らしを楽しみます。</p><a class="btn" href="carinote-workshop-detail.html">詳細を見る</a></article></div></section>
    <section id="local" class="group"><h2>地域文化</h2><div class="items"><article class="item"><h3>地域の技にふれる</h3><p>土地に受け継がれてきた技術を体験します。</p><a class="btn" href="carinote-workshop-detail.html">詳細を見る</a></article></div></section>
  </main>
</body>
</html>
