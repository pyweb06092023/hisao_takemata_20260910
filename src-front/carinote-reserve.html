<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>予約 | Carinote</title>
<style>body{font-family:"Noto Sans JP",sans-serif;background:#FAF8F3;color:#333;margin:0;line-height:1.8}.wrap{width:min(100% - 32px,700px);margin:auto}header{padding:20px 0;background:#fff;border-bottom:1px solid #E6E0D8}header a{color:#8B6F5A;text-decoration:none;font-size:22px;font-weight:700}.box{margin:56px 0;padding:32px;border-radius:12px;background:#fff;box-shadow:0 4px 12px rgb(51 51 51 / 8%)}label{display:block;margin:18px 0 6px;font-weight:700}input,select{width:100%;padding:12px;border:1px solid #D8D2C9;border-radius:8px;font:inherit}input:focus,select:focus{outline:0;border-color:#8B6F5A;box-shadow:0 0 0 3px rgb(139 111 90 / 20%)}button{margin-top:24px;padding:12px 24px;border:0;border-radius:8px;background:#8B6F5A;color:#fff;font:700 16px "Noto Sans JP",sans-serif;cursor:pointer}button:hover{background:#705744}</style>
</head>
<body>
<header>
<div class="wrap">
<a href="carinote-index.html">Carinote</a>
</div>
</header>
<main class="wrap">
<form class="box" action="carinote-reserve-confirm.html">
<p style="color:#D98268;font-weight:700">RESERVATION</p>
<h1>ワークショップを予約する</h1>
<p>自分だけの香りをつくる｜10月10日｜東京・蔵前</p>
<label for="name">氏名（必須）</label>
<input id="name" required>
<label for="email">メールアドレス（必須）</label>
<input id="email" type="email" required>
<label for="people">参加人数</label>
<select id="people">
<option>1名</option>
<option>2名</option>
<option>3名</option>
</select>
<button type="submit">入力内容を確認する</button>
</form>
</main>
</body>
</html>
